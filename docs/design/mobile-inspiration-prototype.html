<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>灵感 · 移动端交互原型 v3</title>
<style>
  /* ═══ 全部取自 mobile/src/index.css 真实 token ═══ */
  :root {
    --primary: #6c5ce7;
    --primary-light: #a29bfe;
    --primary-bg: #f0edff;
    --primary-deep: #4a3f9f;
    --bg: #f5f5f7;
    --bg-card: #ffffff;
    --bg-input: #f0f0f5;
    --text-primary: #1a1a2e;
    --text-secondary: #6b7280;
    --text-muted: #9ca3af;
    --border: #e5e7eb;
    --border-light: #f0f0f5;
    --success: #10b981;
    --success-bg: #e7f8f1;
    --warning: #f59e0b;
    --warning-bg: #fdf3e0;
    --error: #ef4444;
    --error-bg: #fdecec;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --tab-height: 56px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #23282b;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .phone {
    position: relative; width: 100%; height: 100dvh;
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  @media (min-width: 520px) and (min-height: 720px) {
    .phone { width: 392px; height: 846px; border-radius: 44px; border: 9px solid #16181a; box-shadow: 0 24px 70px rgba(0,0,0,.5); }
  }
  .statusbar {
    height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 12px; font-weight: 600; background: var(--bg-card);
  }
  .statusbar .sig { letter-spacing: 2px; font-size: 10px; }

  .screens { position: relative; flex: 1; min-height: 0; }
  .view {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
    transform: translateX(100%);
    transition: transform .28s cubic-bezier(.32,.72,.35,1), visibility .28s;
    visibility: hidden; z-index: 1;
  }
  .view.active { transform: translateX(0); visibility: visible; z-index: 2; }
  .view.base { z-index: 1; }

  /* ── 顶栏:与会话页 SessionListTopbar 同构 ── */
  .topbar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    height: 50px; padding: 0 10px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-light);
  }
  .icon-btn {
    width: 34px; height: 34px; flex-shrink: 0;
    border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .icon-btn:active { background: var(--bg-input); }
  .icon-btn .plus { color: var(--primary); }
  /* ProjectSwitcher 同款:透明底,icon 26 + 名称 16/600 + ▾ */
  .psw {
    flex: 1; min-width: 0; height: 34px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 4px;
    border: none; border-radius: 6px;
    background: transparent; cursor: pointer;
  }
  .psw:active { background: var(--bg-input); }
  .psw .emoji {
    width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff;
  }
  .psw .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .psw .ar { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }

  /* 筛选行:白底,同任务页 filterBar */
  .seg-row { flex-shrink: 0; display: flex; gap: 8px; padding: 10px 16px; background: var(--bg-card); border-bottom: 1px solid var(--border-light); }
  .seg button {
    padding: 6px 14px;
    border: none; border-radius: 16px;
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 13px; font-weight: 500;
    cursor: pointer;
  }
  .seg button b { font-weight: 700; margin-left: 3px; }
  .seg button.on { background: var(--primary); color: #fff; font-weight: 600; }

  /* 下拉刷新 */
  .ptr {
    height: 0; overflow: hidden; opacity: 0;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 11.5px; color: var(--text-muted);
    transition: height .25s, opacity .25s;
    flex-shrink: 0;
  }
  .ptr.show { height: 40px; opacity: 1; }
  .ptr svg { animation: rotate 1s linear infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }

  .cards { flex: 1; overflow-y: auto; padding: 8px 16px 28px; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    padding: 12px 14px 11px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: transform .12s;
  }
  .card:active { transform: scale(.985); }
  .card.new-card { animation: pop .45s ease, glow 2.4s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
  @keyframes glow { 0%, 55% { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(108,92,231,.14); } 100% { border-color: var(--border-light); box-shadow: none; } }
  .card h3 { font-size: 14.5px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .card .exc { margin-top: 3px; font-size: 12px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }
  .ai-blk {
    margin-top: 8px; padding: 7px 9px;
    border-radius: var(--radius-sm);
    background: var(--primary-bg);
    display: flex; gap: 6px; align-items: flex-start;
  }
  .ai-blk b { flex-shrink: 0; font-size: 9.5px; font-weight: 800; color: #fff; background: var(--primary); padding: 1.5px 4.5px; border-radius: 4px; margin-top: 1px; }
  .ai-blk span { font-size: 11.5px; line-height: 1.45; color: var(--primary-deep); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .card-foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text-secondary); }
  .st i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .st.breathe i { animation: breathe 1.15s infinite; }
  @keyframes breathe { 50% { opacity: .25; } }
  .card-foot time { margin-left: auto; font-size: 10.5px; color: var(--text-muted); }
  .card.done { opacity: .6; }
  .card.done h3 { text-decoration: line-through; text-decoration-color: rgba(26,26,46,.25); text-decoration-thickness: 1px; }
  .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text-muted); font-size: 13px; text-align: center; padding: 0 40px;
  }
  .empty svg { color: #c9cdd6; }
  .empty strong { color: var(--text-secondary); font-size: 15px; }

  /* ── 二级页头部 ── */
  .sub-head {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg-card);
  }
  .sub-head .title { font-size: 16px; font-weight: 700; }
  .sub-head .cnt { margin-left: auto; font-size: 11px; color: var(--text-muted); padding-right: 8px; }
  .sub-head .icon-btn { width: 36px; height: 36px; }

  /* ── 记录页 ── */
  .rec-area { flex: 1; display: flex; flex-direction: column; padding: 14px 16px 0; min-height: 0; }
  .rec-area textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent;
    font-size: 15.5px; line-height: 1.7; font-family: inherit;
    color: var(--text-primary);
  }
  .rec-area textarea::placeholder { color: #b9bec9; }
  .rec-foot { flex-shrink: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--border-light); }
  .rec-foot .hint { font-size: 10.5px; color: var(--text-muted); margin-bottom: 9px; }
  .btn-primary {
    width: 100%; padding: 13px;
    border: none; border-radius: var(--radius);
    background: var(--primary); color: #fff;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn-primary:active { background: #5a4bd1; }

  /* ── 详情页 ── */
  .detail-body { flex: 1; overflow-y: auto; padding: 16px 18px 28px; }
  .detail-body h1 { font-size: 20px; line-height: 1.35; font-weight: 700; }
  .d-meta { margin: 8px 0 4px; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--text-muted); }
  .d-sec { margin-top: 18px; }
  .d-sec > .cap { font-size: 11px; font-weight: 750; color: var(--primary-deep); letter-spacing: .4px; margin-bottom: 8px; }
  .d-quote {
    padding: 10px 12px;
    border-left: 3px solid var(--primary);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    background: var(--primary-bg);
    color: var(--primary-deep); font-size: 13px; line-height: 1.55;
  }
  .d-prose { font-size: 13.5px; line-height: 1.75; }
  .d-prose h4 { font-size: 14px; margin: 14px 0 6px; }
  .d-prose p { margin: 6px 0; }
  .d-prose ul { padding-left: 18px; margin: 6px 0; }
  .d-prose li { margin: 3px 0; }
  .d-prose .hl { background: var(--warning-bg); padding: 0 3px; border-radius: 3px; }
  .d-orig {
    padding: 11px 13px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius);
    background: var(--bg-card);
    font-size: 13px; line-height: 1.7; color: var(--text-secondary);
    white-space: pre-wrap;
  }
  .q-box { border: 1px solid #f2dfa8; background: var(--warning-bg); border-radius: var(--radius); padding: 11px 13px; }
  .q-box li { font-size: 12.5px; color: #8a5a00; line-height: 1.6; margin: 4px 0; }
  .cand { border: 1px solid var(--border-light); border-radius: var(--radius); background: var(--bg-card); overflow: hidden; margin-bottom: 9px; }
  .cand .main { padding: 11px 13px 9px; }
  .cand .tag { font-size: 10px; font-weight: 750; color: var(--primary); }
  .cand h5 { font-size: 13.5px; margin: 3px 0 5px; }
  .cand .ag { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #3169a8; }
  .cand .ag em { font-style: normal; padding: 2px 7px; border-radius: 5px; background: #ebf3fb; font-weight: 600; }
  .cand .foot { display: flex; align-items: center; padding: 7px 13px; background: var(--bg); border-top: 1px solid var(--border-light); font-size: 11px; color: var(--text-muted); }
  .cand .foot .ok { color: var(--success); display: inline-flex; align-items: center; gap: 4px; }
  .d-foot {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; gap: 9px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border-light);
  }
  .btn-ghost {
    flex: 1; padding: 12px;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--bg-card); color: var(--text-secondary);
    font-size: 13.5px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-ghost.danger { color: var(--error); }
  .d-foot .btn-primary { flex: 1.4; width: auto; padding: 12px; font-size: 13.5px; }
  .d-wait {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 13px;
    border-radius: var(--radius);
    background: var(--primary-bg); color: var(--primary-deep);
    font-size: 12.5px;
  }
  .d-wait.spin svg { animation: rotate 1s linear infinite; }

  /* ── Tab 栏(同 MobileShell)── */
  .tabbar {
    flex-shrink: 0;
    display: flex; justify-content: space-around; align-items: center;
    height: var(--tab-height);
    background: var(--bg-card);
    border-top: 1px solid var(--border-light);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar button {
    flex: 1; border: none; background: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; color: var(--text-muted);
    cursor: pointer; position: relative;
  }
  .tabbar button.on { color: var(--primary); }
  .badge {
    position: absolute; top: 7px; left: calc(50% + 4px);
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 8px;
    background: var(--primary); color: #fff;
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── 项目抽屉:同会话页 ProjectDrawer(左滑 80%)── */
  .mask {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.4);
    opacity: 0; visibility: hidden;
    transition: opacity .3s; z-index: 8;
  }
  .mask.show { opacity: 1; visibility: visible; }
  .drawer {
    position: absolute; top: 0; left: 0; bottom: 0;
    width: 80%;
    background: var(--bg-card);
    transform: translateX(-105%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    z-index: 9;
    display: flex; flex-direction: column;
    box-shadow: 4px 0 12px rgba(26,26,46,.08);
  }
  .drawer.show { transform: none; }
  .drawer .dr-head {
    flex-shrink: 0;
    padding: 16px 16px 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-light);
    display: flex; align-items: center; justify-content: space-between; gap: 8;
  }
  .drawer .dr-head .t { font-size: 17px; font-weight: 600; }
  .drawer .dr-head .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .dr-list { flex: 1; overflow-y: auto; }
  .dr-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
    cursor: pointer;
    font-size: 15px; color: var(--text-primary);
    transition: background .15s;
  }
  .dr-item:active { background: var(--bg); }
  .dr-item.on { background: var(--bg-input); }
  .dr-item .ic {
    width: 36px; height: 36px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #fff;
  }
  .dr-item .inf { flex: 1; min-width: 0; }
  .dr-item .inf .n { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dr-item .inf .m { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .dr-item .ck { color: var(--primary); font-size: 16px; font-weight: 700; visibility: hidden; }
  .dr-item.on .ck { visibility: visible; }
  .dr-foot { flex-shrink: 0; border-top: 1px solid var(--border-light); }
  .dr-foot .fi {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-light);
    font-size: 14px; color: var(--text-secondary);
    cursor: pointer;
  }
  .dr-foot .fi:last-child { border-bottom: none; }
  .dr-foot .fi .ic2 {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--bg-input);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .dr-foot .fi.new { color: var(--primary); font-weight: 500; }
  .dr-foot .fi.new .ic2 { background: var(--primary-bg); color: var(--primary); }

  /* 删除确认 */
  .dialog-mask {
    position: absolute; inset: 0;
    background: rgba(26,26,46,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity .2s; z-index: 10;
  }
  .dialog-mask.show { opacity: 1; visibility: visible; }
  .dialog {
    width: 78%; background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 20px 18px 14px;
    text-align: center;
    transform: scale(.92); transition: transform .2s;
  }
  .dialog-mask.show .dialog { transform: none; }
  .dialog h5 { font-size: 15.5px; margin-bottom: 7px; }
  .dialog p { font-size: 12.5px; color: var(--text-secondary); line-height: 1.55; margin-bottom: 16px; }
  .dialog .row { display: flex; gap: 9px; }
  .dialog .row button { flex: 1; padding: 10px; border-radius: var(--radius); border: none; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .dialog .cancel { background: var(--bg-input); color: var(--text-secondary); }
  .dialog .ok { background: var(--error); color: #fff; }

  .toast {
    position: absolute; left: 50%; bottom: 84px;
    transform: translateX(-50%) translateY(8px);
    background: rgba(26,26,46,.92);
    color: #fff; font-size: 12.5px;
    padding: 9px 16px; border-radius: 20px;
    opacity: 0; visibility: hidden;
    transition: all .25s;
    z-index: 12; max-width: 78%; text-align: center;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="statusbar"><span>12:53</span><span class="sig">●●● ⌁ ▮</span></div>

  <div class="screens">
    <!-- ═══ 列表页:顶栏 = 会话页同构(☰ / 项目切换器 / ＋) ═══ -->
    <section class="view base active" id="v-list">
      <div class="topbar">
        <button class="icon-btn" id="btn-drawer" aria-label="打开项目抽屉">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button class="psw" id="psw" aria-label="切换项目">
          <span class="emoji" id="psw-emoji"></span>
          <span class="nm" id="psw-name"></span>
          <span class="ar">▾</span>
        </button>
        <button class="icon-btn" id="rec-add" aria-label="记一条灵感">
          <svg class="plus" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="seg-row seg" id="seg"></div>
      <div class="ptr" id="ptr">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/></svg>
        正在同步…
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- ═══ 记录页 ═══ -->
    <section class="view" id="v-record">
      <div class="sub-head">
        <button class="icon-btn" data-back>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="title">新灵感</span>
        <span class="cnt" id="rec-cnt"></span>
      </div>
      <div class="rec-area">
        <textarea id="rec-text" placeholder="想到什么,记一条…" maxlength="50000"></textarea>
      </div>
      <div class="rec-foot">
        <div class="hint">只管写,标题自动取正文前 60 字 · 原文先保存,AI 整理在后台进行</div>
        <button class="btn-primary" id="btn-save">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          记录
        </button>
      </div>
    </section>

    <!-- ═══ 详情页 ═══ -->
    <section class="view" id="v-detail">
      <div class="sub-head">
        <button class="icon-btn" data-back>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="title">灵感详情</span>
      </div>
      <div class="detail-body" id="detail-body"></div>
      <div class="d-foot" id="detail-foot"></div>
    </section>

    <!-- ═══ 项目抽屉:同会话页 ProjectDrawer ═══ -->
    <div class="mask" id="mask-drawer"></div>
    <div class="drawer" id="drawer">
      <div class="dr-head">
        <div><div class="t">项目</div><div class="s" id="dr-sub"></div></div>
      </div>
      <div class="dr-list" id="dr-list"></div>
      <div class="dr-foot">
        <div class="fi new" id="dr-new">
          <div class="ic2">＋</div>新建项目
        </div>
        <div class="fi" id="dr-manage">
          <div class="ic2">⚙</div>管理项目
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Tab 栏 ═══ -->
  <nav class="tabbar">

/* ═══════════ 状态 ═══════════ */
const state = { projectId: 'p1', filter: 'all', noteId: null }
const $ = (id) => document.getElementById(id)
const notesOf = (pid) => NOTES[pid] || []
const curNote = () => notesOf(state.projectId).find((n) => n.id === state.noteId) || null

let toastTimer = null
function toast(msg) {
  const el = $('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200)
}

/* ═══════════ 视图切换 ═══════════ */
function show(id) {
  document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'))
  $(id).classList.add('active')
}
document.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', () => show('v-list')))
document.querySelectorAll('.tabbar [data-tab]').forEach((b) => {
  b.addEventListener('click', () => { if (!b.classList.contains('on')) toast('原型仅演示「灵感」tab') })
})

/* ═══════════ 列表 ═══════════ */
const FILTERS = [ { key: 'all', label: '全部' }, { key: 'active', label: '进行中' }, { key: 'done', label: '已完成' } ]

function visibleNotes() {
  return notesOf(state.projectId).filter((n) => state.filter === 'all' || (state.filter === 'done' ? n.completed : !n.completed))
}

function renderSeg() {
  const list = notesOf(state.projectId)
  const counts = {
    all: list.length,
    active: list.filter((n) => !n.completed).length,
    done: list.filter((n) => n.completed).length,
  }
  $('seg').innerHTML = FILTERS.map((f) =>
    `<button data-f="${f.key}" class="${state.filter === f.key ? 'on' : ''}">${f.label}<b>${counts[f.key]}</b></button>`).join('')
  $('seg').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    state.filter = b.dataset.f
    renderSeg(); renderCards()
  }))
}

function stHtml(n) {
  const s = ST[n.status]
  return `<span class="st ${s.breathe ? 'breathe' : ''}"><i style="background:${s.color}"></i>${s.label}</span>`
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

function renderCards() {
  const box = $('cards')
  const list = visibleNotes()
  if (!list.length) {
    const any = notesOf(state.projectId).length === 0
    box.innerHTML = `<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/></svg>
      <strong>${any ? '还没有灵感记录' : '这里没有匹配的灵感'}</strong>
      <span>${any ? '点右上角 + 记一条,想到什么写下来。<br>原文立即保存,AI 在后台整理。' : '换个筛选看看,或记录一条新的。'}</span>
    </div>`
    return
  }
  box.innerHTML = list.map((n) => `
    <article class="card ${n.completed ? 'done' : ''}" data-id="${n.id}">
      <h3>${esc(n.title)}</h3>
      <div class="exc">${esc(n.excerpt || '')}</div>
      ${n.summary ? `<div class="ai-blk"><b>AI</b><span>${esc(n.summary)}</span></div>` : ''}
      <div class="card-foot">${stHtml(n)}<time>${n.time}</time></div>
    </article>`).join('')
  box.querySelectorAll('.card').forEach((c) => c.addEventListener('click', () => openDetail(c.dataset.id)))
}

/* ═══════════ 详情 ═══════════ */
function openDetail(id) {
  state.noteId = id
  renderDetail()
  show('v-detail')
}

function renderDetail() {
  const n = curNote()
  if (!n) return
  let html = `<h1>${esc(n.title)}</h1>
    <div class="d-meta">${stHtml(n)}<span>·</span><span>${n.time}</span><span>·</span><span>灵感会话整理</span></div>`

  if (n.status === 'processing' || n.status === 'queued') {
    html += `<div class="d-sec"><div class="d-wait spin">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/></svg>
      AI 正在整理,完成后这条卡片会自动更新,不用等在这。</div>
      <div class="d-sec"><div class="cap">原始记录</div><div class="d-orig">${esc(n.excerpt || n.title)}</div></div></div>`
  } else if (n.status === 'failed') {
    html += `<div class="d-sec"><div class="d-wait" style="background:var(--error-bg);color:var(--error)">
      整理失败:${esc(n.lastError || '项目灵感会话没有返回结构化结果')}</div>
      <div class="d-sec"><div class="cap">原始记录(不会丢失)</div><div class="d-orig">${esc(n.excerpt || n.title)}</div></div></div>`
  } else if (n.status === 'draft') {
    html += `<div class="d-sec"><div class="d-wait">尚未整理。点下方「整理一下」,AI 会把这条记录生成方案和候选任务。</div>
      <div class="d-sec"><div class="cap">原始记录</div><div class="d-orig">${esc(n.excerpt || n.title)}</div></div></div>`
  } else {
    if (n.detail) html += `<div class="d-sec">${n.detail}</div>`
    else html += `<div class="d-sec"><div class="d-quote">${esc(n.summary || '')}</div></div>`
    if (n.questions && n.questions.length) {
      html += `<div class="d-sec"><div class="cap">执行前需要确认 · ${n.questions.length}</div><div class="q-box"><ul>${n.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul></div></div>`
    }
    if (n.candidates && n.candidates.length) {
      html += `<div class="d-sec"><div class="cap">候选任务 · ${n.candidates.length} <span style="font-weight:400;color:var(--text-muted)">(每项独立确认,不会自动执行)</span></div>${n.candidates.map((c, i) => `
        <div class="cand"><div class="main">
          <div class="tag">候选 ${i + 1}</div><h5>${esc(c.title)}</h5>
          <div class="ag"><em>${esc(c.agent)}</em><span>${esc(c.reason || '')}</span></div>
        </div><div class="foot">
          ${c.created ? '<span class="ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已创建任务</span>' : '<span>尚未创建 · 请在 PC 端确认后创建</span>'}
        </div></div>`).join('')}</div>`
    } else if (n.status === 'ready') {
      html += `<div class="d-sec"><div style="padding:13px;border:1px dashed var(--border);border-radius:var(--radius);color:var(--text-muted);font-size:12px">当前分析没有生成候选任务,可到 PC 端灵感会话继续讨论。</div></div>`
    }
  }
  $('detail-body').innerHTML = html

  const foot = $('detail-foot')
  if (n.status === 'processing' || n.status === 'queued') {
    foot.innerHTML = ''
  } else if (n.status === 'failed') {
    foot.innerHTML = `<button class="btn-ghost danger" id="d-del">删除</button><button class="btn-primary" id="d-main">↻ 重新整理</button>`
    $('d-main').addEventListener('click', () => { organizeNote(n, '已重新提交整理') })
  } else if (n.status === 'draft') {
    foot.innerHTML = `<button class="btn-ghost danger" id="d-del">删除</button><button class="btn-primary" id="d-main">✦ 整理一下</button>`
    $('d-main').addEventListener('click', () => { organizeNote(n, '已提交整理') })
  } else {
    foot.innerHTML = `<button class="btn-ghost danger" id="d-del">删除</button><button class="btn-primary" id="d-main">${n.completed ? '重新打开' : '✓ 标记完成'}</button>`
    $('d-main').addEventListener('click', () => {
      n.completed = !n.completed
      toast(n.completed ? '已标记完成' : '已重新打开')
      renderDetail(); renderSeg(); renderCards()
    })
  }
  const del = $('d-del')
  if (del) del.addEventListener('click', () => {
    $('dlg-del-text').textContent = `确定删除「${n.title.slice(0, 18)}…」吗?此操作不可恢复。`
    $('dlg-del').classList.add('show')
  })
}

/* ═══════════ 记录(入口 = 顶栏 +,与会话页新建同位) ═══════════ */
$('rec-add').addEventListener('click', () => {
  $('rec-text').value = ''
  updCnt()
  show('v-record')
  setTimeout(() => $('rec-text').focus(), 320)
})
$('rec-text').addEventListener('input', updCnt)
function updCnt() {
  const v = $('rec-text').value
  $('rec-cnt').textContent = v ? `${v.length} 字` : ''
}
$('btn-save').addEventListener('click', () => {
  const text = $('rec-text').value.trim()
  if (!text) { toast('先写点内容再记录'); return }
  const n = {
    id: 'new-' + Date.now(),
    time: '刚刚',
    title: text.replace(/\s+/g, ' ').slice(0, 60),
    excerpt: text.replace(/\s+/g, ' '),
    summary: '', status: 'processing', completed: false,
    detail: null, questions: [], candidates: [],
  }
  notesOf(state.projectId).unshift(n)
  show('v-list')
  renderSeg(); renderCards()
  const el = $('cards').querySelector(`[data-id="${n.id}"]`)
  if (el) { el.classList.add('new-card'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }) }
  toast('已保存,AI 正在后台整理')
  setTimeout(() => finishOrganize(n), 4500)
})

/* ═══════════ 整理模拟(对应 ws 推送 inspiration:update) ═══════════ */
function organizeNote(n, msg) {
  n.status = 'processing'
  n.lastError = null
  renderDetail(); renderSeg(); renderCards()
  toast(msg)
  setTimeout(() => finishOrganize(n), 3500)
}
function finishOrganize(n) {
  n.status = 'ready'
  n.summary = n.summary || '已生成方案与候选任务;点开查看 AI 整理结果,逐项确认后再创建任务。'
  renderSeg(); renderCards()
  if (state.noteId === n.id && $('v-detail').classList.contains('active')) renderDetail()
  toast(`「${n.title.slice(0, 12)}…」整理完成`)
}

/* ═══════════ 项目切换:顶栏 switcher / ☰ → 左侧抽屉(同会话页) ═══════════ */
const curProject = () => PROJECTS.find((p) => p.id === state.projectId)

function renderSwitcher() {
  const p = curProject()
  $('psw-emoji').textContent = p.icon
  $('psw-emoji').style.background = p.color
  $('psw-name').textContent = p.name
}

function openDrawer() {
  $('dr-sub').textContent = `${PROJECTS.length} 个项目`
  $('dr-list').innerHTML = PROJECTS.map((p) => {
    const cnt = notesOf(p.id).length
    const on = p.id === state.projectId
    return `<div class="dr-item ${on ? 'on' : ''}" data-p="${p.id}">
      <div class="ic" style="background:${p.color}">${p.icon}</div>
      <div class="inf"><div class="n">${esc(p.name)}</div><div class="m">${cnt} 条灵感</div></div>
      <span class="ck">✓</span>
    </div>`
  }).join('')
  $('dr-list').querySelectorAll('.dr-item').forEach((el) => el.addEventListener('click', () => {
    if (state.projectId !== el.dataset.p) {
      state.projectId = el.dataset.p
      state.filter = 'all'
      state.noteId = null
      renderSwitcher(); renderSeg(); renderCards()
      toast('已切换到 ' + curProject().name)
    }
    closeDrawer()
  }))
  $('mask-drawer').classList.add('show')
  $('drawer').classList.add('show')
}
function closeDrawer() {
  $('mask-drawer').classList.remove('show')
  $('drawer').classList.remove('show')
}
$('psw').addEventListener('click', openDrawer)
$('btn-drawer').addEventListener('click', openDrawer)
$('mask-drawer').addEventListener('click', closeDrawer)
$('dr-new').addEventListener('click', () => toast('原型仅演示;实现将复用会话页新建项目流程'))
$('dr-manage').addEventListener('click', () => toast('原型仅演示;实现将复用会话页管理项目'))

/* ═══════════ 删除 ═══════════ */
$('dlg-del-cancel').addEventListener('click', () => $('dlg-del').classList.remove('show'))
$('dlg-del-ok').addEventListener('click', () => {
  $('dlg-del').classList.remove('show')
  const list = notesOf(state.projectId)
  const i = list.findIndex((n) => n.id === state.noteId)
  if (i >= 0) list.splice(i, 1)
  state.noteId = null
  show('v-list')
  renderSeg(); renderCards()
  toast('灵感已删除')
})

/* ═══════════ 下拉刷新(列表顶部下拉) ═══════════ */
const cardsEl = $('cards')
let ptrStartY = null, ptrFired = false
cardsEl.addEventListener('touchstart', (e) => {
  if (cardsEl.scrollTop <= 0) { ptrStartY = e.touches[0].clientY; ptrFired = false }
  else ptrStartY = null
}, { passive: true })
cardsEl.addEventListener('touchmove', (e) => {
  if (ptrStartY == null || ptrFired) return
  if (e.touches[0].clientY - ptrStartY > 70) {
    ptrFired = true
    $('ptr').classList.add('show')
  }
}, { passive: true })
cardsEl.addEventListener('touchend', () => {
  if (ptrFired) setTimeout(() => { $('ptr').classList.remove('show'); toast('已同步') }, 650)
  ptrStartY = null; ptrFired = false
})

/* ═══════════ 启动 ═══════════ */
renderSwitcher(); renderSeg(); renderCards()
// 加载 8 秒后,列表里那条「整理中」自动完成——模拟 ws 推送驱动卡片自己变亮
setTimeout(() => {
  const n = notesOf('p1').find((x) => x.id === 'n5')
  if (n && n.status === 'processing') finishOrganize(n)
}, 8000)
</script>
</body>
</html>
